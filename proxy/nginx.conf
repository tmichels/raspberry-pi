events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;

    server {
        listen 80;
        server_name pi.thomasmichels.nl;
        return 308 https://pi.thomasmichels.nl$request_uri;
    }

    server {
        listen 80;
        server_name thomasmichels.nl;
        return 308 https://thomasmichels.nl$request_uri;
    }

    server {
        listen 80;
        server_name login.thomasmichels.nl;
        return 308 https://login.thomasmichels.nl$request_uri;
    }

    server {
        listen 443 ssl;
        server_name pi.thomasmichels.nl;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name login.thomasmichels.nl;

        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name thomasmichels.nl;

        location = /stream {
            return 308 /stream/$is_args$args;
        }

        location /stream/ {
            proxy_pass http://127.0.0.1:4533;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # Fragments are never sent to the server, so the browser must be redirected to them.
        location = /denon {
            return 302 /denon/mobile/index.html#/library/local:directory/;
        }

        location = /denon/ {
            return 302 /denon/mobile/index.html#/library/local:directory/;
        }

        location /denon/ {
            proxy_pass http://192.168.178.96:6680/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 1h;
        }

        location / {
            return 404;
        }
    }
}
