events {}

http {
    ssl_certificate /etc/letsencrypt/live/pi.thomasmichels.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pi.thomasmichels.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server {
        listen 443 ssl;
        server_name pi.thomasmichels.nl;

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name login.thomasmichels.nl;

        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
